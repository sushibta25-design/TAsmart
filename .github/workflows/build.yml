name: Build TAsmart

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: /home/runner/theos
          CI: "true"
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/home/runner/theos" >> "$GITHUB_ENV"
          echo "/home/runner/theos/bin" >> "$GITHUB_PATH"

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          $THEOS/toolchain/linux/iphone/bin/clang --version
          ls -la $THEOS/sdks

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: TAsmart-deb
          path: packages/*.deb
          if-no-files-found: error
